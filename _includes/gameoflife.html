<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p5.js Game Canvas</title>
    <!-- Include the p5.js library from a CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
    <script>
        // Define a global variable for the ball
      console.log("Testing")
        let ball;

        // The setup function is called once when the program starts
        function setup() {
            // Create a canvas of width 800px and height 600px
            createCanvas(800, 600);
            // Initialize the ball object
            ball = {
                x: width / 2,
                y: height / 2,
                diameter: 50,
                xSpeed: 5,
                ySpeed: 3
            };
        }

        // The draw function continuously executes the lines of code contained inside its block until the program is stopped or noLoop() is called
        function draw() {
            // Set the background color to black
            background(0);
            // Draw the ball
            ellipse(ball.x, ball.y, ball.diameter, ball.diameter);

            // Update the ball's position
            ball.x += ball.xSpeed;
            ball.y += ball.ySpeed;

            // Check for collision with the edges of the canvas
            if (ball.x < ball.diameter / 2 || ball.x > width - ball.diameter / 2) {
                ball.xSpeed *= -1; // Reverse the horizontal direction
            }
            if (ball.y < ball.diameter / 2 || ball.y > height - ball.diameter / 2) {
                ball.ySpeed *= -1; // Reverse the vertical direction
            }
        }
    </script>
</body>
</html>
